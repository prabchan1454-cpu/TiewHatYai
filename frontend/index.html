<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="เที่ยวสงขลา ซูเปอร์แอปท่องเที่ยวและไลฟ์สไตล์ พร้อมผู้ช่วย AI น้องเที่ยว ภารกิจ เหรียญรางวัล ข้อมูลโรงพยาบาลและเหตุฉุกเฉิน" />
    <meta name="theme-color" content="#1b2a4a" />
    <script>
      // Apply saved theme before paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem("travelsongkhla_theme");
          var dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Body/UI: IBM Plex Sans Thai (warm, highly legible Thai). -->
    <!-- Display: Chonburi (looped retro face — Hat Yai shop-sign lettering). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Chonburi&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>เที่ยวสงขลา · Travel Songkhla</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
