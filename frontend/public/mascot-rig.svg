<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 340" width="280" height="340"
     role="img" aria-label="น้องเที่ยว — golden mermaid mascot (layered for Rive rigging)">
  <!--
    Layered mascot for Rive rigging.
    Each <g id="..."> is a separate part. Suggested Rive bone pivots noted per group.
    Palette: navy #1b2a4a · gold #ffb020 · sunset #ff7a45 · light-gold #ffd27f · teal #0fb9b1 · skin #ffdcb4
  -->
  <defs>
    <linearGradient id="g-tail" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#ffd27f"/>
      <stop offset="0.5" stop-color="#ffb020"/>
      <stop offset="1" stop-color="#ff7a45"/>
    </linearGradient>
    <linearGradient id="g-hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3f68"/>
      <stop offset="1" stop-color="#1b2a4a"/>
    </linearGradient>
    <radialGradient id="g-pearl" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe6a8"/>
    </radialGradient>
  </defs>

  <!-- ============ BACK HAIR ============ pivot: top of head (140,70) -->
  <g id="hair-back">
    <path d="M78,78 C66,24 122,8 140,8 C158,8 214,24 202,78
             C218,132 212,196 196,250 C189,272 172,270 169,248
             C164,214 168,150 158,138 L122,138 C112,150 116,214 111,248
             C108,270 91,272 84,250 C68,196 62,132 78,78 Z"
          fill="url(#g-hair)"/>
  </g>

  <!-- ============ TAIL ============ pivot: hips (140,196) -->
  <g id="tail">
    <path d="M112,188 C100,224 106,262 140,276 C174,262 180,224 168,188
             C152,200 128,200 112,188 Z" fill="url(#g-tail)"/>
    <!-- fluke -->
    <path d="M140,262 C110,272 82,304 110,308 C131,311 140,292 140,288
             C140,292 149,311 170,308 C198,304 170,272 140,262 Z" fill="url(#g-tail)"/>
    <!-- scale hints -->
    <g id="tail-scales" fill="none" stroke="#d9641f" stroke-width="3" stroke-linecap="round" opacity="0.35">
      <path d="M118,206 Q140,218 162,206"/>
      <path d="M114,226 Q140,239 166,226"/>
      <path d="M116,246 Q140,258 164,246"/>
    </g>
    <!-- fluke shine -->
    <path d="M120,290 Q140,282 160,290" fill="none" stroke="#ffe6b8" stroke-width="3"
          stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- ============ RIGHT ARM (resting) ============ pivot: shoulder (170,164) -->
  <g id="arm-right">
    <path d="M168,162 C186,166 198,180 196,196 C195,206 184,208 180,199
             C176,189 170,178 162,172 Z" fill="#ffdcb4"/>
    <circle cx="190" cy="198" r="9" fill="#ffdcb4"/>
  </g>

  <!-- ============ TORSO + seashell top ============ pivot: chest (140,170) -->
  <g id="torso">
    <path d="M114,156 C114,178 122,192 140,194 C158,192 166,178 166,156
             C166,150 152,151 140,151 C128,151 114,150 114,156 Z" fill="#ffdcb4"/>
    <!-- seashell bikini -->
    <g id="seashell-top">
      <path d="M140,164 C134,156 124,156 120,164 C118,170 124,176 132,176 C138,176 141,170 140,164 Z" fill="#ffb020"/>
      <path d="M140,164 C146,156 156,156 160,164 C162,170 156,176 148,176 C142,176 139,170 140,164 Z" fill="#ff9a3c"/>
      <g stroke="#d9641f" stroke-width="1.5" opacity="0.5" fill="none">
        <path d="M130,166 L130,175 M125,167 L124,174 M135,166 L136,175"/>
        <path d="M150,166 L150,175 M155,167 L156,174 M145,166 L144,175"/>
      </g>
      <path d="M118,162 Q140,156 162,162" stroke="#ffd27f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ============ HEAD ============ pivot: neck (140,150) -->
  <g id="head">
    <!-- ears -->
    <circle cx="84" cy="118" r="9" fill="#ffdcb4"/>
    <circle cx="196" cy="118" r="9" fill="#ffdcb4"/>
    <!-- face -->
    <ellipse id="face" cx="140" cy="110" rx="60" ry="58" fill="#ffdcb4"/>

    <!-- cheeks -->
    <g id="cheeks" fill="#ff9a8b" opacity="0.55">
      <ellipse cx="104" cy="128" rx="12" ry="7.5"/>
      <ellipse cx="176" cy="128" rx="12" ry="7.5"/>
    </g>

    <!-- LEFT EYE -->
    <g id="eye-left">
      <ellipse cx="116" cy="108" rx="14" ry="17.5" fill="#ffffff"/>
      <ellipse cx="117" cy="110" rx="11" ry="14.5" fill="#1b2a4a"/>
      <circle cx="112" cy="104" r="4.5" fill="#ffffff"/>
      <circle cx="121" cy="114" r="2.4" fill="#ffffff" opacity="0.9"/>
      <path d="M101,95 Q112,87 127,93" fill="none" stroke="#1b2a4a" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- RIGHT EYE -->
    <g id="eye-right">
      <ellipse cx="164" cy="108" rx="14" ry="17.5" fill="#ffffff"/>
      <ellipse cx="163" cy="110" rx="11" ry="14.5" fill="#1b2a4a"/>
      <circle cx="159" cy="104" r="4.5" fill="#ffffff"/>
      <circle cx="168" cy="114" r="2.4" fill="#ffffff" opacity="0.9"/>
      <path d="M153,93 Q168,87 179,95" fill="none" stroke="#1b2a4a" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- nose + mouth -->
    <path d="M137,128 Q140,131 143,128" fill="none" stroke="#e0a982" stroke-width="2" stroke-linecap="round"/>
    <g id="mouth">
      <path d="M126,138 Q140,154 154,138 Q140,146 126,138 Z" fill="#c0392b"/>
      <path d="M132,144 Q140,150 148,144 Q140,148 132,144 Z" fill="#ff7a8a"/>
    </g>

    <!-- FRONT HAIR / bangs -->
    <g id="hair-front">
      <path d="M80,108 C74,58 108,40 140,40 C172,40 206,58 200,108
               C194,86 178,74 160,72 C168,82 166,96 158,100
               C160,82 138,74 130,90 C128,80 108,76 102,94
               C98,82 86,90 80,108 Z" fill="url(#g-hair)"/>
    </g>

    <!-- TIARA -->
    <g id="tiara">
      <path d="M108,58 Q140,40 172,58 Q140,50 108,58 Z" fill="#ffb020"/>
      <circle cx="140" cy="52" r="7.5" fill="url(#g-pearl)" stroke="#ffb020" stroke-width="2"/>
      <circle cx="120" cy="58" r="3" fill="#ffe6a8"/>
      <circle cx="160" cy="58" r="3" fill="#ffe6a8"/>
    </g>
  </g>

  <!-- ============ LEFT ARM (waving) ============ pivot: shoulder (112,164) — animate rotation for wave -->
  <g id="arm-left">
    <path d="M112,162 C96,150 86,128 90,106 C92,98 102,98 104,107
             C106,124 112,144 122,154 Z" fill="#ffdcb4"/>
    <circle cx="93" cy="103" r="9.5" fill="#ffdcb4"/>
  </g>
</svg>
