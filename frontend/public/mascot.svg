<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="น้องเที่ยว — golden mermaid mascot">
  <defs>
    <linearGradient id="m-tail" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffd27f"/>
      <stop offset="0.5" stop-color="#ffb020"/>
      <stop offset="1" stop-color="#ff7a45"/>
    </linearGradient>
    <linearGradient id="m-hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3f68"/>
      <stop offset="1" stop-color="#1b2a4a"/>
    </linearGradient>
  </defs>

  <!-- hair (back + side strands) -->
  <path d="M58 104 C50 56 82 30 120 30 C158 30 190 56 182 104
           C180 130 184 150 176 168 C170 150 168 128 160 120
           L80 120 C72 128 70 150 64 168 C56 150 60 130 58 104 Z"
        fill="url(#m-hair)"/>

  <!-- tail -->
  <path d="M92 150 C78 176 84 200 120 208 C156 200 162 176 148 150 Z" fill="url(#m-tail)"/>
  <!-- tail fluke -->
  <path d="M120 200 C94 208 68 230 94 232 C112 234 120 218 120 216
           C120 218 128 234 146 232 C172 230 146 208 120 200 Z" fill="url(#m-tail)"/>
  <!-- scale hints -->
  <path d="M98 164 Q120 174 142 164 M96 180 Q120 191 144 180" fill="none"
        stroke="#1b2a4a" stroke-width="3" stroke-linecap="round" opacity="0.28"/>

  <!-- torso -->
  <path d="M100 132 C100 148 104 156 120 158 C136 156 140 148 140 132 Z" fill="#ffdcb4"/>
  <!-- shell top -->
  <circle cx="110" cy="142" r="10" fill="url(#m-tail)"/>
  <circle cx="130" cy="142" r="10" fill="url(#m-tail)"/>

  <!-- arms -->
  <path d="M98 130 C84 136 80 148 86 158" fill="none" stroke="#ffdcb4" stroke-width="11" stroke-linecap="round"/>
  <path d="M142 130 C156 136 160 148 154 158" fill="none" stroke="#ffdcb4" stroke-width="11" stroke-linecap="round"/>

  <!-- head -->
  <circle cx="120" cy="96" r="48" fill="#ffe2bd"/>
  <!-- bangs -->
  <path d="M72 92 C74 56 96 42 120 42 C144 42 166 56 168 92
           C152 74 138 80 120 80 C102 80 88 74 72 92 Z" fill="url(#m-hair)"/>

  <!-- big expressive eyes -->
  <ellipse cx="102" cy="100" rx="11" ry="13.5" fill="#fff"/>
  <ellipse cx="138" cy="100" rx="11" ry="13.5" fill="#fff"/>
  <circle cx="104" cy="102" r="7" fill="#1b2a4a"/>
  <circle cx="136" cy="102" r="7" fill="#1b2a4a"/>
  <circle cx="106.5" cy="99" r="2.6" fill="#fff"/>
  <circle cx="138.5" cy="99" r="2.6" fill="#fff"/>

  <!-- cheeks -->
  <circle cx="86" cy="116" r="7" fill="#ff9a8b" opacity="0.55"/>
  <circle cx="154" cy="116" r="7" fill="#ff9a8b" opacity="0.55"/>

  <!-- happy open smile -->
  <path d="M107 118 Q120 133 133 118 Z" fill="#1b2a4a"/>
  <path d="M112 124 Q120 130 128 124 Z" fill="#ff7a8a"/>

  <!-- pearl crown -->
  <circle cx="120" cy="46" r="5" fill="#ffb020"/>
  <circle cx="104" cy="52" r="3.4" fill="#ffd27f"/>
  <circle cx="136" cy="52" r="3.4" fill="#ffd27f"/>

  <!-- sparkles -->
  <path d="M178 70 l3.4 8 8 3.4 -8 3.4 -3.4 8 -3.4 -8 -8 -3.4 8 -3.4 Z" fill="#ffd27f"/>
  <path d="M52 140 l2.4 6 6 2.4 -6 2.4 -2.4 6 -2.4 -6 -6 -2.4 6 -2.4 Z" fill="#ffb020"/>
</svg>
